# Name of the GitHub Actions workflow
name: Event Service CI

# Run the workflow when code is pushed or a pull request targets main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Allow the workflow to read repository code and publish packages to GHCR
permissions:
  contents: read
  packages: write

# Define the tasks that GitHub Actions should run
jobs:
  build-test-and-publish:

    # Run the job on a GitHub-hosted Ubuntu machine
    runs-on: ubuntu-latest

    steps:
      # Download the repository code into the runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Install Java 25 and enable Maven dependency caching
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # Build the application and run all unit tests
      - name: Build and run tests
        run: mvn clean test

      # Log in to GitHub Container Registry
      # Run only when code is pushed to the main branch
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image and publish it to GHCR
      # Run only after a push to main
      - name: Build and publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/bhaktirathod/event-service:latest